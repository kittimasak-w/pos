<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ใบเสร็จรับเงิน</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            max-width: 480px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            font-size: 16px;
        }

        h2 {
            margin-bottom: 10px;
            text-align: center;
        }

        .receipt {
            border: 1px solid #e5e5e5;
            padding: 16px;
            border-radius: 12px;
        }

        .items table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        .items th, .items td {
            text-align: left;
            padding: 6px 0;
        }

        .items td:last-child {
            text-align: right;
        }

        .total {
            text-align: right;
            margin-top: 16px;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-print {
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>ใบเสร็จรับเงิน</h2>

<div class="receipt">
    <div id="receiptMeta"></div>
    <div class="items">
        <table id="receiptItems"></table>
    </div>
    <div class="total" id="receiptTotal"></div>
</div>

<button class="btn btn-primary btn-print" onclick="window.print()">พิมพ์ใบเสร็จ</button>
<br><br>
<button class="btn btn-outline" onclick="window.location.href='cashier.html'">
    กลับไปหน้าขาย
</button>

<button class="btn btn-outline" onclick="window.location.href='table.html'">
    กลับไปหน้าโต๊ะ
</button>


<script src="app.js"></script>
<script src="orders.js"></script>

<script>
    (function() {

        const OrderStore = window.OrderStore;
        const { formatCurrency, formatDateTime } = window.AppUtils;

        // อ่าน orderId จาก URL ?order=XXXX
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get("order");
        const orderId = rawId ? Number(rawId) : null;

        // ✔ ใช้ getById แทน get
        const order = orderId ? OrderStore.getById(orderId) : null;

        if (!order) {
            alert("ไม่พบข้อมูลใบเสร็จ");
            window.location.href = "table.html";
            return;
        }

        // แสดงข้อมูลหัวใบเสร็จ
        document.getElementById("receiptMeta").innerHTML = `
        เลขที่ออเดอร์: <strong>#${order.orderNo}</strong><br>
        วันที่: <strong>${formatDateTime(order.createdAt)}</strong><br>
        โต๊ะ: <strong>${order.tableId || '-'}</strong>
    `;

        // แสดงรายการสินค้า
        const tbody = document.getElementById("receiptItems");
        tbody.innerHTML = "";

        order.items.forEach(i => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
            <td>${i.name} x${i.qty}</td>
            <td>${formatCurrency(i.price * i.qty)}</td>
        `;
            tbody.appendChild(tr);
        });

        // รวมทั้งหมด
        document.getElementById("receiptTotal").textContent =
            "รวมทั้งหมด: " + formatCurrency(order.total);

    })();
</script>


</body>
</html>
