<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Demo POS - สรุปรายการก่อนชำระเงิน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header>
        <div>
            <div class="title">สรุปรายการ</div>
            <div id="checkoutTableInfo"
                 style="display:none; font-weight:700; color:#2563eb; margin-top:6px; font-size:15px;">
            </div>
            <div class="card-subtitle">ตรวจสอบรายการก่อนชำระเงิน</div>
        </div>
        <div class="nav">
            <a href="cashier.html"><button class="btn btn-outline btn-sm">← กลับไปแก้ไข</button></a>
            <!-- ⭐ เพิ่ม -->
            <a id="btnBackToTable" href="table.html" style="display:none;">
                <button class="btn btn-outline btn-sm">กลับหน้าโต๊ะ</button>
            </a>
        </div>
<!--        <button class="btn btn-outline btn-sm" id="btnLogout">ออกจากระบบ</button>-->

    </header>


    <section class="section">
        <div class="pos-layout">

            <!-- CART SUMMARY -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">รายการสินค้า</div>
                        <div class="card-subtitle">ตรวจสอบจำนวนและยอดรวม</div>
                    </div>
                </div>

                <div class="cart-items" style="max-height:400px;">
                    <table>
                        <thead>
                        <tr>
                            <th>สินค้า</th>
                            <th>จำนวน</th>
                            <th>ราคารวม</th>
                        </tr>
                        </thead>
                        <tbody id="checkoutItems"></tbody>
                    </table>
                </div>

                <div class="cart-summary">
                    <div class="text-muted small">ยอดรวมทั้งหมด</div>
                    <div class="cart-total" id="checkoutTotal">฿0</div>
                </div>
            </div>

            <!-- PAYMENT PANEL -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">เลือกวิธีชำระเงิน</div>
                        <div class="card-subtitle">กรุณาเลือก 1 วิธี</div>
                    </div>
                    <div id="checkoutTableInfo"
                         style="display:none; font-weight:700; color:#2563eb; margin-bottom:10px;">
                    </div>

                </div>

                <div class="field">
                    <label>วิธีชำระเงิน</label>
                    <select id="paymentMethodFinal">
                        <option value="cash">เงินสด</option>
                        <option value="qr">QR PromptPay</option>
                        <option value="card">บัตรเครดิต / เดบิต</option>
                        <option value="transfer">โอนเงิน</option>
                    </select>
                </div>

                <div class="inline" style="margin-top:8px;">
                    <input type="checkbox" id="isPaidFinal" checked>
                    <label for="isPaidFinal">ชำระเงินแล้ว (Paid)</label>
                </div>

                <button class="btn btn-primary" id="btnConfirmPayment" style="margin-top: 16px;">
                    ยืนยันและบันทึกออเดอร์
                </button>

                <button class="btn btn-danger btn-sm" id="btnCancelOrder" style="margin-top: 10px;">
                    ยกเลิกออเดอร์
                </button>

            </div>

        </div>
    </section>
</div>

<!--<script src="auth.js"></script>-->
<script src="app.js"></script>
<script src="orders.js"></script>
<script src="table.js"></script>
<script src="checkout.js"></script>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);

        if (params.has("table")) {
            const tableId = params.get("table");

            // ⭐ แสดงข้อความด้านบน
            const info = document.getElementById("checkoutTableInfo");
            info.textContent = "คิดเงินโต๊ะ " + tableId;
            info.style.display = "block";

            // ⭐ แสดงปุ่มกลับไปหน้าโต๊ะ
            const btnBack = document.getElementById("btnBackToTable");
            btnBack.style.display = "inline-block";

            // ⭐ เปลี่ยน badge ให้เป็นโหมดโต๊ะ
            const badge = document.querySelector(".badge");
            if (badge) {
                badge.textContent = "โต๊ะ " + tableId;
                badge.style.background = "#2563eb";
                badge.style.color = "white";
            }
        }
    })();
</script>

<script>
    document.getElementById("btnLogout")?.addEventListener("click", function () {
        localStorage.removeItem("pos_logged_in");
        window.location.href = "login.html";
    });
</script>

</body>
</html>
