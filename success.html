<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ออเดอร์สำเร็จ</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .success-box {
            max-width: 480px;
            margin: 80px auto;
            background: white;
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .success-icon {
            font-size: 64px;
            color: #22c55e;
            margin-bottom: 16px;
        }
        .success-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .success-text {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .btn-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="success-box">
    <div class="success-icon">✔</div>
    <div class="success-title">บันทึกออเดอร์สำเร็จ</div>
    <div class="success-text">ออเดอร์ถูกบันทึกเรียบร้อยแล้ว</div>

    <div class="btn-area">
        <button class="btn btn-primary" onclick="printReceipt()">
            พิมพ์ใบเสร็จ
        </button>

        <a href="cashier.html">
            <button class="btn btn-outline" style="width: 100%;">กลับไปหน้าขาย</button>
        </a>
    </div>
</div>

<script>
    function printReceipt() {
        window.location.href = "receipt.html";
    }
</script>

</body>
</html>
