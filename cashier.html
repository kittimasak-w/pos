<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Demo POS - Cashier</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div>

            <div class="title">
                Demo POS - Cashier
                <span class="badge">ขายหน้าร้าน</span>
            </div>

            <!-- ⭐ แสดงเมื่อเป็นโหมดโต๊ะ -->
            <div id="cashierTableInfo"
                 style="display:none; margin-top:6px; font-weight:700; color:#2563eb; font-size:15px;">
            </div>

            <div class="card-subtitle">
                เลือกสินค้า ใส่จำนวน และดำเนินการสั่งออเดอร์
            </div>
        </div>

        <div class="nav">

            <a href="admin.html">
                <button class="btn btn-outline btn-sm">จัดการสินค้า</button>
            </a>

            <a href="prepare.html">
                <button class="btn btn-outline btn-sm">เตรียมสินค้า</button>
            </a>

            <a href="table.html">
                <button class="btn btn-outline btn-sm">หน้าโต๊ะ</button>
            </a>

            <a href="sales.html">
                <button class="btn btn-outline btn-sm">ดูยอดขายทั้งหมด</button>
            </a>

            <!-- ⭐ ปุ่มกลับไปหน้าโต๊ะ (เฉพาะ table mode) -->
            <a id="btnBackToTable" href="table.html" style="display:none;">
                <button class="btn btn-outline btn-sm">กลับหน้าโต๊ะ</button>
            </a>
        </div>
    </header>


    <section class="section">
        <div class="pos-layout">

            <!-- PRODUCTS -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">เลือกรายการสินค้า</div>
                        <div class="card-subtitle">แตะที่สินค้าเพื่อเพิ่มเข้าตะกร้า</div>
                    </div>
                    <span class="badge-soft" id="productCountLabel"></span>
                </div>

                <div class="product-grid" id="productList"></div>
            </div>

            <!-- CART -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">ตะกร้าสินค้า</div>
                        <div class="card-subtitle">กด + / - เพื่อเปลี่ยนจำนวน</div>
                    </div>
                    <button class="btn btn-outline btn-sm" id="btnClearCart">ล้างตะกร้า</button>
                </div>

                <div class="cart">
                    <div class="cart-items">
                        <table>
                            <thead>
                            <tr>
                                <th>สินค้า</th>
                                <th>จำนวน</th>
                                <th>ราคา/ชิ้น</th>
                                <th>รวม</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="cartBody"></tbody>
                        </table>
                    </div>

                    <div class="cart-summary">
                        <div class="text-muted small">ยอดสุทธิ</div>
                        <div class="cart-total" id="cartTotal">฿0</div>
                    </div>

                    <div class="cart-actions">
                        <button class="btn btn-primary" id="btnSaveOrder">
                            บันทึกออเดอร์
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </section>

</div>

<script src="app.js"></script>
<script src="products.js"></script>
<script src="orders.js"></script>
<script src="table.js"></script>
<script src="cashier.js"></script>

<!-- ⭐ Script UI โหมดโต๊ะ -->
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);

        if (params.has("table")) {
            const tableId = params.get("table");

            // ⭐ เปลี่ยนแสดงข้อความ
            const info = document.getElementById("cashierTableInfo");
            info.textContent = "กำลังสั่งให้โต๊ะ " + tableId;
            info.style.display = "block";

            // ⭐ แสดงปุ่มกลับหน้าโต๊ะ
            const backBtn = document.getElementById("btnBackToTable");
            backBtn.style.display = "inline-block";

            // ⭐ เปลี่ยน badge ให้เป็นสีฟ้า
            const badge = document.querySelector(".badge");
            if (badge) {
                badge.textContent = "โต๊ะ " + tableId;
                badge.style.background = "#2563eb";
                badge.style.color = "white";
            }
        }
    })();
</script>

</body>
</html>
